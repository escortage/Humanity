- type: worldWarAmbience
  id: HumanityWorldWarTwo
  indoorGain: 0.25
  fadeDuration: 2
  layers:
  - sound:
      path: /Audio/Civ/Ambience/ww2_battle_distant.ogg
      params:
        loop: true
        volume: -19
  - sound:
      path: /Audio/Effects/Weather/wind_2_1.ogg
      params:
        loop: true
        volume: -32
  - sound:
      collection: HumanityDistantArtillery
      params:
        volume: -12
        variation: 0.08
    interval: 4, 10
  - sound:
      collection: HumanityNearbyArtillery
      params:
        volume: -20
        variation: 0.08
    interval: 11, 23
  - sound:
      collection: HumanityWorldWarAircraft
      params:
        volume: -20
        variation: 0.04
    interval: 75, 140

