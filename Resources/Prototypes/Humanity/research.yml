- type: entity
  id: HumanityResearchTable
  parent: TableWoodClassic
  name: стол исследований
  description: Рабочее место для опытов. Возьмите нужный материал в руку и используйте его на столе. Осмотрите стол, чтобы узнать требования и общий прогресс цивилизации.
  components:
    - type: NomadResearchTable
    - type: IconSmooth
      enabled: false
      mode: NoSprite
    - type: Sprite
      layers:
      - state: full
      - sprite: Civ14/Weapons/stone_hammer.rsi
        state: stone_hammer
        scale: 0.35,0.35
        offset: -0.2,0.08
    - type: Construction
      graph: HumanityResearchTable
      node: end

- type: construction
  id: HumanityResearchTable
  name: humanity-construction-HumanityResearchTable-name
  description: humanity-construction-HumanityResearchTable-description
  graph: HumanityResearchTable
  startNode: start
  targetNode: end
  category: construction-category-production
  icon: { sprite: Civ14/Structures/old_table4.rsi, state: full }
  objectType: Structure
  agemin: 0
  agemax: 8
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
    - !type:TileNotBlocked

- type: constructionGraph
  id: HumanityResearchTable
  start: start
  graph:
    - node: start
      edges:
        - to: frame
          steps:
            - material: WoodPlank
              amount: 8
              doAfter: 8
    - node: frame
      entity: HumanityResearchFrame
      edges:
        - to: end
          steps:
            - material: Stone
              amount: 5
              doAfter: 4
    - node: end
      entity: HumanityResearchTable

- type: entity
  id: HumanityResearchFrame
  parent: CounterWoodFrame
  name: каркас стола исследований
  description: Осталось подготовить каменные инструменты.
  components:
    - type: Sprite
      color: "#BC986FFF"
    - type: Construction
      graph: HumanityResearchTable
      node: frame
    - type: Destructible
      thresholds:
      - trigger: !type:DamageTrigger
          damage: 40
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: WoodDestroy
        - !type:SpawnEntitiesBehavior
          spawn:
            MaterialWoodPlank1:
              min: 4
              max: 4
        - !type:DoActsBehavior
          acts: [ Destruction ]
