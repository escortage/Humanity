- type: entity
  id: HumanityBattleCrater
  name: воронка
  description: Неглубокая яма от взрыва. В неё можно заползти.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Humanity/Effects/crater.rsi
    state: crater
    drawdepth: FloorObjects
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: BattleScar
    radiusPerTile: 0.16
    minimumRadius: 0.45
    maximumRadius: 1.8
    explosionDamageMultiplier: 0.85
    proneExplosionDamageMultiplier: 0.65
    enterDelay: 1
    exitDelay: 1

- type: entity
  id: HumanityBattleRubble
  name: обломки
  components:
  - type: Sprite
    sprite: Civ14/Objects/structures.rsi
    state: debris1
    drawdepth: FloorObjects
    noRot: true
  - type: BattleScar
    radius: 0.5
    rubble: true

- type: battleCraterVisuals
  id: HumanityBattleCrater
  verticalCompression: 1.35
  interiorRadiusFactor: 0.8
  bodyDepth: 0.18
  mergeRadiusFactor: 0.9
  baseEdgeRadius: 0.88
  edgeRoughness: 0.045,0.035
  interiorDepth: 0.16
  rimDepth: 0.07
  interiorColor: "#343023"
  rimColor: "#413B2A"
  edgeColor: "#574E36"
